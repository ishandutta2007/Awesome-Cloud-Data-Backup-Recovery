<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .node-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* CSS Animations for dynamic elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(0.9) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCloud {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes waveShield {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .dynamic-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashMove 2.5s linear infinite;
    }
    .floating-cloud-node {
      animation: floatCloud 4s ease-in-out infinite;
    }
    .shield-badge {
      animation: waveShield 3s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glowing Orbs in the background -->
  <g class="dynamic-orb-1">
    <circle cx="220" cy="110" r="140" fill="#0284c7" filter="url(#softGlow)" />
  </g>
  <g class="dynamic-orb-2">
    <circle cx="980" cy="280" r="160" fill="#7c3aed" filter="url(#softGlow)" />
  </g>
  <circle cx="620" cy="380" r="100" fill="#0d9488" filter="url(#softGlow)" opacity="0.3" />

  <!-- Subtle Blueprint Grid Pattern -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Data Stream Lines in Bottom / Right Graphics -->
  <g opacity="0.65">
    <path class="stream-line" d="M 820 180 C 890 140, 950 140, 1030 180" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="stream-line" d="M 820 240 C 900 280, 970 270, 1030 230" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <path class="stream-line" d="M 770 210 L 820 210" fill="none" stroke="#34d399" stroke-width="2" />
  </g>

  <!-- Visual Graphic Accent Right Side: Cloud Backup & Recovery Nodes -->
  <g class="floating-cloud-node" transform="translate(80, 0)">
    <!-- Central Cloud Target Node -->
    <g transform="translate(840, 150)">
      <rect x="0" y="0" width="130" height="110" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)"/>
      <!-- Cloud Icon SVG inside -->
      <path d="M 45 68 A 14 14 0 0 1 45 42 A 20 20 0 0 1 80 34 A 20 20 0 0 1 95 52 A 16 16 0 0 1 90 70 Z" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M 65 52 L 65 64 M 60 56 L 65 52 L 70 56" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="65" y="93" text-anchor="middle" class="node-text" font-weight="600" fill="#e2e8f0">Cloud Vault</text>
    </g>

    <!-- Source/On-Prem Workload Node -->
    <g transform="translate(680, 175)">
      <rect x="0" y="0" width="105" height="70" rx="12" fill="url(#cardGrad)" stroke="#64748b" stroke-width="1.2" />
      <rect x="18" y="20" width="69" height="10" rx="3" fill="#334155" />
      <rect x="18" y="36" width="69" height="10" rx="3" fill="#334155" />
      <circle cx="25" cy="25" r="2" fill="#22c55e" />
      <circle cx="25" cy="41" r="2" fill="#22c55e" />
      <text x="52" y="60" text-anchor="middle" class="node-text" font-size="10">Primary Workloads</text>
    </g>

    <!-- Immutable Recovery Replica Node -->
    <g transform="translate(1010, 175)">
      <rect x="0" y="0" width="110" height="70" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <!-- Shield lock symbol -->
      <path d="M 55 20 L 70 26 C 70 40, 55 48, 55 48 C 55 48, 40 40, 40 26 Z" fill="#7e22ce" fill-opacity="0.35" stroke="#c084fc" stroke-width="1.8" />
      <text x="55" y="61" text-anchor="middle" class="node-text" font-size="10">Air-Gapped DR</text>
    </g>
  </g>

  <!-- Foreground Content: Pill Category Tag -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
    <circle cx="16" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="22" class="badge-text">ENTERPRISE CLOUD RESILIENCE</text>
  </g>

  <!-- Main Foreground Title -->
  <!-- Strictly kept in foreground with high contrast so no animated element can obscure it -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" class="title-text">
      Cloud Data Backup &amp; Recovery
    </text>
    <!-- Cyan-to-Purple Gradient Accent Line -->
    <rect x="0" y="16" width="620" height="4" rx="2" fill="url(#accentCyan)" />
  </g>

  <!-- Subtitle and Description -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" class="subtitle-text">
      Curated BaaS Platforms, DR Orchestration &amp; Open-Source Engines
    </text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b">
      Immutable Backups • Ransomware Quarantine • Kubernetes Resilience • Deduplicated Storage
    </text>
  </g>

  <!-- Feature Tags / Pills Bar along the Bottom-Left -->
  <g transform="translate(80, 305)">
    <!-- Pill 1: BaaS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="67" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">☁️ BaaS &amp; DRaaS</text>
    </g>

    <!-- Pill 2: Immutable Storage -->
    <g transform="translate(145, 0)">
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🔒 Immutable Vaults</text>
    </g>

    <!-- Pill 3: Open-Source -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ Self-Hosted OSS</text>
    </g>

    <!-- Pill 4: Cleanroom Recovery -->
    <g transform="translate(475, 0)">
      <rect x="0" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="85" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">🛡️ Cyber Cleanrooms</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>
</svg>
